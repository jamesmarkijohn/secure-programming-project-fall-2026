services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .                          # repo root, so the build can see database/
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    env_file: .env                        # passes every .env variable into the container
    environment:
      POSTGRES_HOST: db                   # reach the database by its service name
    depends_on:
      db:
        condition: service_healthy        # wait until PostgreSQL accepts connections
    networks:
      - backend
    # No "ports:" -- the backend will only be reachable through Caddy (Step 10).
    # For testing before then, you can temporarily add:
    #   ports:
    #     - "127.0.0.1:8000:8000"
    # (127.0.0.1 keeps it reachable from your machine only.) Remove it afterward.

networks:
  backend:
    internal: true

volumes:
  pgdata:
