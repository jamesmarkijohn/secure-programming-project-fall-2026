services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    # No "ports:" -- the backend will only be reachable through Caddy.
    # For testing before Caddy is set up, can temporarily add:
    #   ports:
    #     - "127.0.0.1:8000:8000"
    # Remove loopback IP afterward.

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src/frontend/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
    depends_on:
      - backend
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
  caddy_data:
